<!DOCTYPE html>
<html>
  <body>

    <h1>Example</h1>

    <p>With template strings, the indentation is part of the string.</p>
    <p>This is not visible for most HTML elements, but the PRE element preservers any spaces and new lines:</p>

    <pre id="demo"></pre>

    <script>
      const x = `
        John:
          Hello, how are you?
        Jane:
          I'm fine, thanks!
      `;

      document.getElementById("demo").innerHTML = x;

    </script>

  </body>
</html>
