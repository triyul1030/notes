<!DOCTYPE html>
<html>
  <body>

    <h1>Example</h1>

    <p>With template strings you can add variables inside ${} brackets:</p>

    <div id="demo"></div>

    <script>
      let firstName = "John";
      let lastName = "Doe";

      let text = `Welcome ${firstName}, ${lastName}!`;

      document.getElementById("demo").innerHTML = text;
    </script>

  </body>
</html>
