<!DOCTYPE html>
<html>

  <body>

    <p id="demo"></p>
      
    <script>
      const person = {
        firstName: "John",
        lastName: "Doe",
        age: 50
      };

      // Destructuring
      let {firstName} = person;

      document.getElementById("demo").innerHTML = firstName;

    </script>

  </body>
</html>
